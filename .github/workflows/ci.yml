name: CI

# Two tiers. Every push and pull request runs the offline tests: no model, no key, a few seconds.
# The full 20-case evaluation needs a model, so it runs on demand or on a version tag,
# and it fails the run when fewer cases pass than the threshold.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      min_pass:
        description: "Cases that must pass out of 20"
        default: "18"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q

  evals:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      DEMO_LLM: gemini:gemini-3.5-flash
      DEMO_RPM: "4"
    steps:
      - name: Check for a model key
        id: key
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::notice::No GOOGLE_API_KEY secret, evaluation skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.skip != 'true'
      - uses: astral-sh/setup-uv@v5
        if: steps.key.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra gemini
        if: steps.key.outputs.skip != 'true'
      - name: Run the 20 cases
        if: steps.key.outputs.skip != 'true'
        run: uv run python -m evals.run_evals --min-pass "${{ inputs.min_pass || '18' }}"
      - name: Publish the report
        if: always() && steps.key.outputs.skip != 'true'
        run: cat evals/results/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.skip != 'true'
        with:
          name: eval-report
          path: evals/results/
