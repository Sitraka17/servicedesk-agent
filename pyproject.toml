[project]
name = "servicedesk-agent"
version = "0.1.0"
description = "LangGraph IT service desk agent talking to a fake ServiceNow through MCP, with an evaluation harness."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=2.1"]
ollama = ["langchain-ollama>=0.3"]
anthropic = ["langchain-anthropic>=0.3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["servicenow_mcp*", "agent*", "evals*"]
